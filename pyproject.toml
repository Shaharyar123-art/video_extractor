[project]
name = "videoextractor"
version = "0.1.0"
description = "Cricket highlights se player ki shorts nikalna aur compilation banana"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "opencv-python>=4.12",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "typer>=0.16",
    "rich>=14.0",
]

# Baad ke phases mein add honge:
# Phase 2: rapidocr, onnxruntime, faster-whisper, rapidfuzz
# Phase 3: torch (CPU), torchvision
# Phase 4: moviepy, librosa
# Phase 5: fastapi, uvicorn, sqlmodel, python-multipart, sse-starlette

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# B008: typer.Option() defaults ka idiom hai; PLW1510: returncode khud check karte hain
ignore = ["B008", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
